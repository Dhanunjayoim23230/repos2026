# Global settings applied across all configurations unless overridden
global:
  scrape_interval: 15s     # How frequently to scrape targets (default is 1m)
  evaluation_interval: 15s # How frequently to evaluate rules (default is 1m)
  # scrape_timeout: 10s    # Per-scrape timeout (default is 10s)

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            # - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

# A list of endpoints (jobs) for Prometheus to scrape
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped
  - job_name: "prometheus"
    # metrics_path defaults to '/metrics'
    # scheme defaults to 'http'
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app: "prometheus"
          name: "prometheus"

  - job_name: 'ec2-instances'
    ec2_sd_configs:
      - region: 'us-east-1'
        filters:
          - name: tag:Monitoring
            values:
            - true
        port: 9100

    relabel_configs:
      # Use the EC2 'Name' tag as the Prometheus 'instance' label
      - source_labels: [__meta_ec2_instance_id]
        target_label: instance_id
      # Preserve the instance ID as a label
      - source_labels: [__meta_ec2_tag_Name]
        target_label: name
      - source_labels: [__meta_ec2_private_ip]
        target_label: ec2_private_ip

